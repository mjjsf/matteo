name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          # Project pages are served from /<repo>/, so assets need the subpath.
          # Reproduce locally with:
          #   VITE_BASE=/matteo/ npm run build && npm run preview
          VITE_BASE: /matteo/
          # Optional. Without it, links simply carry no affiliate tag.
          VITE_AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
      - uses: actions/configure-pages@v5
      # Uploads a filesystem path, with no relationship to git's index — which
      # is why `dist/` can stay in .gitignore. The legacy gh-pages-branch
      # pattern would have needed `git add -f dist`.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
