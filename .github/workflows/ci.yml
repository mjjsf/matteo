name: CI

on:
  # `pull_request` only. Adding a `push` trigger for non-main branches would
  # double-run this workflow on every push to a branch that has an open PR.
  # main is covered by the deploy workflow, which runs the same checks.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the neighbours freshness test, which fails if src/generated is
      # stale relative to the authored corpus. That is the safety net for
      # committing a baked similarity table.
      - run: npm test
      - run: npm run build
