name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Includes the layout freshness test, which fails if src/generated is
      # stale relative to the authored corpus. That is the safety net for
      # committing baked coordinates.
      - run: npm test
      - run: npm run build
